services:
  web:
    build: .
    init: true
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      WAREHOUSE_HTTPS: ${WAREHOUSE_HTTPS:-0}
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-8000}:8000"
    volumes:
      - warehouse-data:/data

volumes:
  warehouse-data:
