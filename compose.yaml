x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-warehouse}
  POSTGRES_USER: ${POSTGRES_USER:-warehouse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

x-app: &app
  build: .
  image: ${WAREHOUSE_IMAGE:-warehouse-django:1.0.0}
  init: true
  environment:
    <<: *database-environment
    DATABASE_ENGINE: postgresql
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    DEBUG: ${DEBUG:-0}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    WAREHOUSE_HTTPS: ${WAREHOUSE_HTTPS:-0}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    GUNICORN_THREADS: ${GUNICORN_THREADS:-4}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment: *database-environment
    volumes:
      - warehouse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  init:
    <<: *app
    restart: "no"
    command: ["sh", "-ec", "python manage.py migrate --noinput && python manage.py configure_warehouse_roles"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "warehouse.health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  warehouse-postgres-data:
