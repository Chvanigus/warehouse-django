{% if can_change or can_delete %}
  <td class="text-nowrap">
    {% if can_change %}<a href="{% url edit_route entry.pk %}" class="btn btn-sm btn-outline-primary">Изменить</a>{% endif %}
    {% if can_delete %}<a href="{% url delete_route entry.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>{% endif %}
  </td>
{% endif %}
