{% if entry.invoice_id or can_cancel and not entry.cancelled_at %}
  <div class="operation-record-actions">
    {% if entry.invoice_id %}
      <a href="{% url 'invoices:detail' entry.invoice_id %}" class="btn btn-sm btn-outline-primary">Накладная</a>
    {% elif can_cancel and not entry.cancelled_at %}
      <a href="{% url cancel_route entry.pk %}" class="btn btn-sm btn-outline-danger">Отменить документ</a>
    {% endif %}
  </div>
{% endif %}
