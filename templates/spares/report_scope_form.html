<form method="get" class="workspace-panel p-3 p-lg-4 mb-4">
  <h2 class="h5 mb-3">Параметры отчёта</h2>
  {{ form.non_field_errors }}
  <div class="row g-3">
    {% for field in form %}
      <div class="col-md-4">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
  </div>
  <div class="d-flex flex-wrap gap-2 mt-3">
    <button type="submit" class="btn btn-primary">Сформировать отчёт</button>
    <a class="btn btn-outline-secondary" href="{{ request.path }}">Сбросить</a>
  </div>
</form>
