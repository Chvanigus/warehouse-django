<div class="row g-3">
  {% for field in form.visible_fields %}
    {% if field.field.widget.input_type != 'checkbox' %}
      <div class="{% if field.name == 'q' %}col-lg-6{% else %}col-sm-6 col-lg-3{% endif %}">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small mt-1" role="alert">{{ field.errors }}</div>{% endif %}
      </div>
    {% endif %}
  {% endfor %}
</div>
