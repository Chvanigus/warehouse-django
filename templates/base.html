{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Складской учёт{% endblock %}</title>
  <link rel="icon" href="{% static 'images/warehouse.svg' %}">
  <link rel="stylesheet" href="{% static 'libs/bootstrap/css/bootstrap.min.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% include 'include/header.html' %}
  {% if messages %}
    <div class="container pt-3">
      {% for message in messages %}
        <div class="alert {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %}" role="status">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  <script src="{% static 'libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  {% block extra_javascript %}{% endblock %}
</body>
</html>
